name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# One job that runs bin/ci and nothing else, so that what passes here is what
# passes locally. Branch protection requires it by name. See PRODUCT.md,
# "Contract: continuous integration".
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # What the floors compare against: a pull request's target branch, or on a
      # push to main the commit main pointed at before it.
      CI_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # mutant and exhale diff against the base, so they need its history.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The runner image ships Chrome, which the system tests drive headless.
      - name: Run bin/ci
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

      - name: Keep mutant's full output
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutant-floor-log
          path: ${{ github.workspace }}/log/mutant-floor.log
          if-no-files-found: ignore
