# Decisions the mutation gate accepts with a reason (bin/mutant-floor,
# PRODUCT.md CI-5). Append only: each list at the base must be the start of
# the same list on the change, and only the entries after it count. Every
# entry needs a reason, and adding one takes the pull request outside G1.
#
# equivalents: a survivor the change brings that no test can kill. Each entry
# accepts one survivor with that subject and change (the lines the mutation
# removes and adds, as bin/mutant-floor prints them; trailing whitespace is
# ignored).
#
#   - subject: HomeController#show
#     change: |-
#       -  @sections = Section.for_page("home").visible.ordered
#       +  @sections = Section.for_page("home").visible
#     reason: Why no test can tell the two apart.
#
# config: a change that lets mutation do less. Each entry excuses only what it
# names, with either
#   subjects: methods the base selected that no subject runs any more
#     (config/mutant.yml stopped selecting them, they moved where it doesn't
#     reach, a `def` became an `attr_reader`, or they were deleted), or
#   change: config, for a change to config/mutant.yml outside its subjects
#     and ignores (operators, the timeout, coverage criteria, requires,
#     includes, hooks), or
#   change: harness, for a change to test/mutant/boot.rb or hooks.rb.
#
#   - subjects: [ HomeController#show ]
#     reason: What changes, and why mutation can do less.
equivalents:
  - subject: SiteSetting#copy_link_placeholder
    change: |-
      -  token = COPY_LINKS[key.to_s.delete_suffix("_es")]
      +  token = COPY_LINKS[key.delete_suffix("_es")]
    reason: >-
      The two differ only for a record whose key is nil, where nil.to_s gives
      "" and the mutation raises instead. No caller can validate such a record:
      Admin -> Copy builds its records only from the permitted copy keys, and
      SiteSetting.[]= stores key.to_s. Every record the app validates has a
      String key, for which to_s returns the string itself.
  - subject: SiteSetting#copy_link_placeholder
    change: |-
      -  token = COPY_LINKS[key.to_s.delete_suffix("_es")]
      +  token = COPY_LINKS[key.to_str.delete_suffix("_es")]
    reason: >-
      String#to_str and String#to_s both return the string itself. They differ
      only for a record whose key is nil, which no caller can validate: Admin
      -> Copy builds its records only from the permitted copy keys, and
      SiteSetting.[]= stores key.to_s.
  - subject: SiteSetting#copy_link_placeholder
    change: |-
      -  errors.add(:value, "for #{key} must contain #{token} exactly once.")
      +  errors.add(:value__mutant__, "for #{key} must contain #{token} exactly once.")
    reason: >-
      The record is refused either way. The attribute only changes the word
      Rails humanizes in front of the message ("Value"). CO-5 asks that the
      error name the field and its placeholder, and the mutated message still
      does; the CO-5 tests check both. Telling the two apart would pin Rails'
      wording of an attribute name, which the Contract's membership test
      excludes.
  - subject: SiteSetting.[]
    change: |-
      -    record = find_by(key: key.to_s)
      +    record = find_by(key:)
    reason: >-
      Active Record casts the value bound to the string key column to a
      String, so find_by(key: x) and find_by(key: x.to_s) run the same query
      for a String or a Symbol key. Every caller passes a String in any case.
  - subject: SiteSetting.[]
    change: |-
      -    record = find_by(key: key.to_s)
      +    record = find_by(key: key.to_str)
    reason: >-
      String#to_str and String#to_s both return the string itself. They differ
      only for a Symbol key, which raises here. Every caller under app/ passes
      a String: a literal such as "site_title", or a key from the copy and
      settings key lists.
  - subject: SiteSetting.[]
    change: |-
      -    record&.value.presence || DEFAULTS[key.to_s]
      +    record&.value.presence || DEFAULTS.fetch(key.to_s)
    reason: >-
      fetch differs only when the key has no default and no nonblank row,
      where it raises instead of returning nil. Every key the app reads
      through SiteSetting[] has a default: site_title, email, github_url,
      linkedin_url, theme_preset, tagline, and the English copy keys that
      SiteSetting.localized falls back to.
  - subject: SiteSetting.[]
    change: |-
      -    record&.value.presence || DEFAULTS[key.to_s]
      +    record&.value.presence || DEFAULTS[key.to_str]
    reason: >-
      String#to_str and String#to_s both return the string itself. They differ
      only for a Symbol key, which raises here. Every caller under app/ passes
      a String.
  - subject: SiteSetting.[]
    change: |-
      -    record&.value.presence || DEFAULTS[key.to_s]
      +    record&.value.presence || DEFAULTS[key]
    reason: >-
      DEFAULTS has String keys, so the two differ only for a Symbol key, which
      would miss its default. Every caller under app/ passes a String.
  - subject: SiteSetting.[]=
    change: |-
      -    find_or_initialize_by(key: key.to_s).update(value:)
      +    find_or_initialize_by(key:).update(value:)
    reason: >-
      Active Record casts the key to the string column's type both in the
      lookup and on the new record, so a String or a Symbol key finds or
      creates the same row. The one caller, Admin -> Settings, passes the
      String keys of its permitted parameters.
  - subject: SiteSetting.[]=
    change: |-
      -    find_or_initialize_by(key: key.to_s).update(value:)
      +    find_or_initialize_by(key: key.to_str).update(value:)
    reason: >-
      String#to_str and String#to_s both return the string itself. They differ
      only for a Symbol key, which raises here. The one caller, Admin ->
      Settings, passes the String keys of its permitted parameters.
  - subject: SiteSetting.copy_translation
    change: |-
      -      DEFAULTS[spanish_key]
      +      self[spanish_key]
    reason: >-
      This branch runs only when no row has the Spanish key. SiteSetting[]
      then finds no row either and returns DEFAULTS for the same key, so the
      value is the same; the mutation only adds a query.
  - subject: SiteSetting.copy_translation
    change: |-
      -      DEFAULTS[spanish_key]
      +      DEFAULTS.fetch(spanish_key)
    reason: >-
      fetch differs only for a key with no Spanish default, where it raises.
      copy_translation is called only with the ten copy keys (through
      SiteSetting.localized and untranslated?, whose callers pass copy keys),
      and each has a Spanish default in DEFAULTS, which CO-3's test reads back
      for every one of them.
  - subject: SiteSetting.theme_preset
    change: |-
      -    preset = self["theme_preset"].to_s
      +    preset = self["theme_preset"]
    reason: >-
      SiteSetting["theme_preset"] returns a nonblank stored String or the
      default, "workshop", so it is always a String and to_s returns it
      unchanged.
  - subject: SiteSetting.theme_preset
    change: |-
      -    preset = self["theme_preset"].to_s
      +    preset = self["theme_preset"].to_str
    reason: >-
      SiteSetting["theme_preset"] returns a nonblank stored String or the
      default, "workshop", so it is always a String, and to_str returns it
      unchanged just as to_s does.
config:
  - change: harness
    reason: >-
      test/mutant/boot.rb fixes Minitest's seed at 0 in place of mutant's random
      one, so the change's run and its base's run order the tests alike (D-22).
      The same tests load; nothing is skipped.
